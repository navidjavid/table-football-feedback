<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Table Football</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Admin Panel</div>
    <div class="topbar-actions">
      <a href="/" class="link-muted">Dashboard</a>
      <button id="logout-btn" class="btn btn-ghost">Logout</button>
    </div>
  </header>

  <main class="page">

    <section>
      <h2>Pico Devices</h2>
      <div class="card">
        <table class="admin-table" id="picos-table">
          <thead>
            <tr>
              <th>Pico ID</th>
              <th>Table</th>
              <th>Side</th>
              <th>Role</th>
              <th>IP</th>
              <th>Firmware</th>
              <th>Status</th>
              <th>Last seen</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Tables</h2>
      <div class="card">
        <form id="create-table-form" class="inline-form">
          <input type="text" id="new-table-name" placeholder="New table name" required />
          <input type="text" id="new-table-location" placeholder="Location (optional)" />
          <button class="btn btn-primary" type="submit">Create Table</button>
        </form>
        <div id="tables-list"></div>
      </div>
    </section>

    <section>
      <h2>Players</h2>
      <div class="card">
        <table class="admin-table" id="admin-players-table">
          <thead>
            <tr>
              <th>Player</th>
              <th>UID</th>
              <th>Type</th>
              <th class="num">Games</th>
              <th class="num">Wins</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Generic prompt modal used by admin actions. -->
  <div class="modal hidden" id="prompt-modal" aria-hidden="true">
    <div class="modal-panel narrow" role="dialog" aria-modal="true">
      <button class="modal-close" data-close>×</button>
      <h3 id="prompt-title"></h3>
      <form id="prompt-form">
        <label id="prompt-label" for="prompt-input">Value</label>
        <input type="text" id="prompt-input" />
        <div class="form-error" id="prompt-error"></div>
        <div class="form-actions">
          <button type="button" data-close class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
